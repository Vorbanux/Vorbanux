name: Update Steam Status

on:
  schedule:
    - cron: '*/30 * * * *' # Скрипт будет запускаться каждые 30 минут
  workflow_dispatch: # Позволяет запускать вручную кнопкой в интерфейсе

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run script
      env:
        STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        STEAM_ID: ${{ secrets.STEAM_ID }}
      run: python auto_update.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add README.md
        git commit -m "chore: update steam status" || exit 0
        git push
